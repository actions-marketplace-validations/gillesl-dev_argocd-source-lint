apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: broken-ref-file
spec:
  sources:
    - repoURL: https://charts.example.invalid/repo
      chart: something
      targetRevision: "1.0.0"
      helm:
        valueFiles:
          - $values/applications/broken-ref-file/does-not-exist.yaml
    - repoURL: https://example.invalid/repo.git
      targetRevision: HEAD
      ref: values
